<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WordVault">
<title>WordVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a18;
    --paper: #f5f0e8;
    --cream: #ede8db;
    --accent: #c4522a;
    --accent-light: #e8835f;
    --muted: #8a8478;
    --border: #d4cfc2;
    --card: #faf7f2;
    --serif: 'Playfair Display', Georgia, serif;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--ink);
    padding: 16px 20px 14px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-top: calc(16px + env(safe-area-inset-top));
  }

  header h1 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    color: var(--paper);
    letter-spacing: -0.3px;
  }

  header .tagline {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  header .wotd-chip {
    margin-left: auto;
    background: var(--accent);
    color: white;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  header .wotd-chip:hover { background: var(--accent-light); }

  .tabs {
    display: flex;
    background: var(--cream);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: var(--paper);
  }

  .panel { display: none; padding: 20px; }
  .panel.active { display: block; }

  .search-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .search-input {
    flex: 1;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--serif);
    font-size: 18px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); font-style: italic; font-size: 16px; }

  .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent-light); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .result-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-word {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .result-phonetic {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .result-pos {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: #f8ece6;
    border-radius: 4px;
    padding: 2px 8px;
    margin-bottom: 8px;
  }

  .result-def {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .result-example {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
    border-left: 3px solid var(--accent-light);
    padding-left: 12px;
    margin-top: 8px;
    line-height: 1.5;
  }

  .result-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .btn-save {
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
  }
  .btn-save:hover { background: #333; }
  .btn-save.saved { background: #4a7c59; }

  .btn-more {
    background: transparent;
    color: var(--muted);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-more:hover { border-color: var(--muted); color: var(--ink); }

  .more-defs { display: none; margin-top: 12px; }
  .more-defs.open { display: block; }
  .def-group { margin-bottom: 12px; }

  .loading {
    text-align: center;
    padding: 30px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .loading::after {
    content: '';
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: #fdf0ec;
    border: 1px solid #f0c4b4;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14px;
    color: var(--accent);
    font-family: var(--mono);
  }

  .vault-header {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
    gap: 10px;
  }
  .vault-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .vault-sort {
    margin-left: auto;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink);
    outline: none;
    cursor: pointer;
  }

  .vault-search {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .vault-search:focus { border-color: var(--accent); }

  .vault-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .vault-empty .big-letter {
    font-family: var(--serif);
    font-size: 72px;
    opacity: 0.15;
    line-height: 1;
    margin-bottom: 12px;
  }
  .vault-empty p {
    font-size: 14px;
    line-height: 1.6;
  }

  .word-entry {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .word-entry:hover { border-color: var(--accent-light); box-shadow: 0 2px 12px rgba(196,82,42,0.08); }
  .word-entry.expanded { border-color: var(--accent); }

  .entry-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .entry-word {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 700;
  }
  .entry-pos-tag {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .entry-date {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .entry-preview {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-full {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .entry-full.open { display: block; }
  .entry-full .result-def { font-size: 14px; }

  .entry-del {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: var(--border);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }
  .entry-del:hover { color: var(--accent); background: #fdf0ec; }

  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,26,24,0.65);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-bg.open { display: flex; }

  .modal {
    background: var(--ink);
    color: var(--paper);
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 380px;
    width: 100%;
    position: relative;
    animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
  }

  .modal-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-light);
    margin-bottom: 6px;
  }

  .modal-word {
    font-family: var(--serif);
    font-size: 40px;
    font-weight: 700;
    line-height: 1.05;
    margin-bottom: 4px;
  }

  .modal-phonetic {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .modal-pos {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--accent-light);
    margin-bottom: 10px;
  }

  .modal-def {
    font-size: 16px;
    line-height: 1.65;
    color: #e8e3da;
  }

  .modal-example {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
    border-left: 3px solid var(--accent);
    padding-left: 14px;
    margin-top: 14px;
    line-height: 1.6;
  }

  .modal-date {
    font-family: var(--mono);
    font-size: 10px;
    color: #555;
    margin-top: 20px;
    letter-spacing: 0.04em;
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--paper);
    font-size: 18px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    line-height: 30px;
    text-align: center;
    transition: background 0.2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.2); }

  .modal-shuffle {
    margin-top: 18px;
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.2s;
  }
  .modal-shuffle:hover { background: var(--accent-light); }

  .rule {
    text-align: center;
    color: var(--border);
    font-family: var(--serif);
    font-size: 18px;
    letter-spacing: 0.2em;
    margin: 6px 0 16px;
    user-select: none;
  }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 18px;
    border-radius: 20px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 300;
    letter-spacing: 0.04em;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>WordVault</h1>
    <div class="tagline">Your personal lexicon</div>
  </div>
  <div class="wotd-chip" onclick="showWOTD()">✦ Word of the Day</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('lookup')">Look Up</div>
  <div class="tab" onclick="switchTab('vault')">My Vault</div>
</div>

<div class="panel active" id="panel-lookup">
  <div class="rule">· · ·</div>
  <div class="search-wrap">
    <input class="search-input" id="wordInput" type="text" placeholder="Enter a word…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn" id="lookupBtn" onclick="lookupWord()">Look Up</button>
  </div>
  <div id="lookupResult"></div>
</div>

<div class="panel" id="panel-vault">
  <div class="rule">· · ·</div>
  <div class="vault-header">
    <span class="vault-count" id="vaultCount">0 words</span>
    <select class="vault-sort" id="vaultSort" onchange="renderVault()">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="alpha">A → Z</option>
    </select>
  </div>
  <input class="vault-search" id="vaultSearch" type="text" placeholder="Filter words…" oninput="renderVault()">
  <div id="vaultList"></div>
</div>

<div class="modal-bg" id="wotdModal" onclick="closeWOTD(event)">
  <div class="modal" id="wotdCard">
    <button class="modal-close" onclick="document.getElementById('wotdModal').classList.remove('open')">×</button>
    <div class="modal-label">✦ Word of the Day</div>
    <div class="modal-word" id="wotdWord">—</div>
    <div class="modal-phonetic" id="wotdPhonetic"></div>
    <div class="modal-pos" id="wotdPos"></div>
    <div class="modal-def" id="wotdDef">Save some words to your vault to see a word of the day.</div>
    <div class="modal-example" id="wotdExample" style="display:none"></div>
    <div class="modal-date" id="wotdDate"></div>
    <button class="modal-shuffle" onclick="shuffleWOTD()">✦ Show another word</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'wordvault_v1';

function loadVault() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveVault(vault) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(vault));
}

function isWordSaved(word) {
  return loadVault().some(e => e.word.toLowerCase() === word.toLowerCase());
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['lookup','vault'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'vault') renderVault();
}

document.getElementById('wordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookupWord();
});

async function lookupWord() {
  const input = document.getElementById('wordInput');
  const word = input.value.trim();
  if (!word) return;

  const resultEl = document.getElementById('lookupResult');
  const btn = document.getElementById('lookupBtn');
  btn.disabled = true;
  resultEl.innerHTML = '<div class="loading">Fetching definition</div>';

  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    renderResult(data, resultEl);
  } catch {
    resultEl.innerHTML = `<div class="error-msg">No definition found for "<em>${word}</em>". Check spelling and try again.</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderResult(data, container) {
  const entry = data[0];
  const word = entry.word;
  const phonetic = entry.phonetics?.find(p => p.text)?.text || '';
  const meanings = entry.meanings || [];
  const primary = meanings[0];
  const primaryDef = primary?.definitions?.[0];
  const saved = isWordSaved(word);

  let moreDefs = '';
  if (meanings.length > 1 || (primary?.definitions?.length > 1)) {
    moreDefs = `<button class="btn-more" onclick="toggleMore(this)">More definitions</button>
    <div class="more-defs">`;
    meanings.forEach((m, mi) => {
      m.definitions.slice(mi === 0 ? 1 : 0).forEach(d => {
        moreDefs += `<div class="def-group">
          <span class="result-pos">${m.partOfSpeech}</span>
          <div class="result-def">${d.definition}</div>
          ${d.example ? `<div class="result-example">${d.example}</div>` : ''}
        </div>`;
      });
    });
    moreDefs += `</div>`;
  }

  container.innerHTML = `
    <div class="result-card" id="resultCard">
      <div class="result-word">${word}</div>
      ${phonetic ? `<div class="result-phonetic">${phonetic}</div>` : ''}
      <span class="result-pos">${primary?.partOfSpeech || ''}</span>
      <div class="result-def">${primaryDef?.definition || ''}</div>
      ${primaryDef?.example ? `<div class="result-example">${primaryDef.example}</div>` : ''}
      ${moreDefs}
      <div class="result-actions">
        <button class="btn-save ${saved ? 'saved' : ''}" id="saveBtn" onclick="saveFromResult(${JSON.stringify(word)}, this)">
          ${saved ? '✓ In Vault' : '+ Save to Vault'}
        </button>
      </div>
    </div>`;

  window._currentEntry = { data, word };
}

function toggleMore(btn) {
  const more = btn.nextElementSibling;
  more.classList.toggle('open');
  btn.textContent = more.classList.contains('open') ? 'Fewer definitions' : 'More definitions';
}

function saveFromResult(word, btn) {
  if (isWordSaved(word)) { showToast('Already in vault'); return; }

  const { data } = window._currentEntry;
  const entry = data[0];
  const meanings = entry.meanings || [];
  const phonetic = entry.phonetics?.find(p => p.text)?.text || '';

  const defs = [];
  meanings.forEach(m => {
    m.definitions.slice(0, 3).forEach(d => {
      defs.push({ pos: m.partOfSpeech, def: d.definition, example: d.example || '' });
    });
  });

  const vaultEntry = { word, phonetic, defs, savedAt: new Date().toISOString() };
  const vault = loadVault();
  vault.unshift(vaultEntry);
  saveVault(vault);

  btn.textContent = '✓ In Vault';
  btn.classList.add('saved');
  showToast(`"${word}" saved to vault`);
}

function renderVault() {
  let vault = loadVault();
  const sort = document.getElementById('vaultSort').value;
  const filter = document.getElementById('vaultSearch').value.trim().toLowerCase();

  if (filter) vault = vault.filter(e => e.word.toLowerCase().includes(filter));
  if (sort === 'alpha') vault.sort((a, b) => a.word.localeCompare(b.word));
  else if (sort === 'oldest') vault.sort((a, b) => new Date(a.savedAt) - new Date(b.savedAt));

  document.getElementById('vaultCount').textContent = `${vault.length} word${vault.length !== 1 ? 's' : ''}`;
  const list = document.getElementById('vaultList');

  if (vault.length === 0) {
    list.innerHTML = `<div class="vault-empty">
      <div class="big-letter">W</div>
      <p>${filter ? 'No words match your filter.' : 'Your vault is empty.<br>Look up words and save them here.'}</p>
    </div>`;
    return;
  }

  list.innerHTML = vault.map((e, i) => {
    const primary = e.defs?.[0];
    const date = new Date(e.savedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    return `
      <div class="word-entry" id="entry-${i}" onclick="toggleEntry(${i})">
        <button class="entry-del" onclick="deleteEntry(event, '${e.word}')">×</button>
        <div class="entry-top">
          <span class="entry-word">${e.word}</span>
          ${primary ? `<span class="entry-pos-tag">${primary.pos}</span>` : ''}
          <span class="entry-date">${date}</span>
        </div>
        ${primary ? `<div class="entry-preview">${primary.def}</div>` : ''}
        <div class="entry-full" id="full-${i}">
          ${e.phonetic ? `<div class="result-phonetic">${e.phonetic}</div>` : ''}
          ${(e.defs || []).map(d => `
            <div class="def-group" style="margin-bottom:10px">
              <span class="result-pos">${d.pos}</span>
              <div class="result-def">${d.def}</div>
              ${d.example ? `<div class="result-example">${d.example}</div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>`;
  }).join('');
}

function toggleEntry(i) {
  document.getElementById('full-' + i).classList.toggle('open');
  document.getElementById('entry-' + i).classList.toggle('expanded');
}

function deleteEntry(e, word) {
  e.stopPropagation();
  saveVault(loadVault().filter(v => v.word !== word));
  renderVault();
  showToast(`"${word}" removed`);
}

let wotdIndex = -1;

function showWOTD() {
  const vault = loadVault();
  document.getElementById('wotdModal').classList.add('open');

  if (vault.length === 0) {
    document.getElementById('wotdWord').textContent = '—';
    document.getElementById('wotdPhonetic').textContent = '';
    document.getElementById('wotdPos').textContent = '';
    document.getElementById('wotdDef').textContent = 'Save some words to your vault to see a word of the day.';
    document.getElementById('wotdExample').style.display = 'none';
    document.getElementById('wotdDate').textContent = '';
    return;
  }

  if (wotdIndex === -1) {
    const dayNum = Math.floor(Date.now() / 86400000);
    wotdIndex = dayNum % vault.length;
  }
  renderWOTD(vault[wotdIndex]);
}

function shuffleWOTD() {
  const vault = loadVault();
  if (!vault.length) return;
  wotdIndex = Math.floor(Math.random() * vault.length);
  renderWOTD(vault[wotdIndex]);
}

function renderWOTD(entry) {
  document.getElementById('wotdWord').textContent = entry.word;
  document.getElementById('wotdPhonetic').textContent = entry.phonetic || '';
  const primary = entry.defs?.[0];
  document.getElementById('wotdPos').textContent = primary?.pos || '';
  document.getElementById('wotdDef').textContent = primary?.def || '';
  const exEl = document.getElementById('wotdExample');
  if (primary?.example) {
    exEl.textContent = primary.example;
    exEl.style.display = 'block';
  } else {
    exEl.style.display = 'none';
  }
  const date = new Date(entry.savedAt).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  document.getElementById('wotdDate').textContent = `Saved ${date}`;
}

function closeWOTD(e) {
  if (e.target === document.getElementById('wotdModal')) {
    document.getElementById('wotdModal').classList.remove('open');
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

renderVault();
</script>
</body>
</html>
